        <line x1="320" y1="308" x2="320" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <line x1="350" y1="356" x2="350" y2="308" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>

        <line x1="430" y1="228" x2="512" y2="228" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <path d="M 512,244 H 456 Q 448,244 448,252 V 276 H 430" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>

        <path d="M 430,286 H 472 Q 480,286 480,294 V 361 H 512" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <path d="M 512,385 H 456 Q 448,385 448,377 V 300 H 430" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>

