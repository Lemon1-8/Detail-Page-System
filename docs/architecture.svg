        <rect x="512" y="338" width="176" height="94" rx="6" fill="#f5f5f5"/>
        <rect x="512" y="338" width="176" height="94" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="520" y="346" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="534" y="355" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="600" y="377" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">图片生成 API</text>
        <text x="600" y="395" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/generate-detail</text>
        <text x="600" y="411" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Sharp + Base64</text>
        <text x="676" y="423" fill="#2d3142" font-size="26" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end" fill-opacity="0.08">03</text>

