        <text x="217" y="275" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPLOAD</text>

        <rect x="344" y="322" width="58" height="12" rx="2" fill="#f5f5f5"/>
        <text x="373" y="331" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HISTORY</text>
        <rect x="274" y="322" width="58" height="12" rx="2" fill="#f5f5f5"/>
        <text x="303" y="331" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESTORE</text>

        <rect x="442" y="210" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="474" y="219" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ANALYZE</text>
        <rect x="456" y="252" width="38" height="12" rx="2" fill="#f5f5f5"/>
        <text x="475" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>

        <rect x="488" y="322" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="331" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GENERATE</text>
        <rect x="382" y="342" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="406" y="351" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IMAGES</text>

        <rect x="790" y="201" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="818" y="210" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI TEXT</text>
        <rect x="790" y="393" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="822" y="402" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI IMAGE</text>

        <rect x="204" y="360" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXPORT</text>

        <!-- Node: user input. -->
        <rect x="56" y="250" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="250" width="144" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="64" y="258" width="28" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="78" y="267" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
