        <text x="128" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser input</text>

        <!-- Node: web app focal. -->
        <rect x="240" y="196" width="190" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="196" width="190" height="112" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="248" y="204" width="28" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="262" y="213" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="335" y="231" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">详情页 Web App</text>
        <text x="335" y="249" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app/page.tsx</text>
        <text x="335" y="265" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">压缩 · 状态 · 导出</text>
        <text x="418" y="297" fill="#bf4520" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end" fill-opacity="0.10">01</text>

        <!-- Node: browser history store. -->
        <rect x="240" y="356" width="190" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="356" width="190" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="248" y="364" width="42" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="269" y="373" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="335" y="391" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">本地历史记录</text>
        <text x="335" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">localStorage · 20 条</text>

        <!-- Node: downloadable output. -->
        <rect x="56" y="392" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="392" width="144" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="64" y="400" width="30" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="79" y="409" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="128" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">长图下载</text>
        <text x="128" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PNG · 750 px</text>

        <!-- Node: text analysis API. -->
        <rect x="512" y="172" width="176" height="94" rx="6" fill="#f5f5f5"/>
        <rect x="512" y="172" width="176" height="94" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="520" y="180" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="534" y="189" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="600" y="211" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">文本分析 API</text>
        <text x="600" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/analyze</text>
        <text x="600" y="245" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenAI JSON</text>
        <text x="676" y="257" fill="#2d3142" font-size="26" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end" fill-opacity="0.08">02</text>

